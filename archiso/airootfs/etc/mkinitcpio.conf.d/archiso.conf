# StickLab OS mkinitcpio drop-in — adds the archiso live-boot hooks.
# Without this, mkinitcpio uses the stock HOOKS and the ISO builds but can never
# boot (initramfs can't find/mount the live medium).
# Deliberately leaner than archiso's releng set: no `kms` (would drag every GPU
# driver + firmware, incl. the huge nvidia-open modules, into the initramfs and
# blow the 2GB budget), no `memdisk`/PXE (no network-boot menu on this ISO).
# COMPRESSION stays at the distro default (zstd) for faster builds.
HOOKS=(base udev microcode modconf archiso archiso_loop_mnt block filesystems keyboard)
