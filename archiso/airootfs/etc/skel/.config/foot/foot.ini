# StickLab OS foot — JetBrains Mono, dark lavender
# THEME IT: the accent is selection-background + regular5 below. Swap one pair:
#   lavender (default)  b4befe / cba6f7 | mint  a6e3a1 / 94e2d5 | peach  fab387 / f38ba8
[main]
font=JetBrains Mono:size=11   # try: font=JetBrains Mono:size=13, or any font you install
pad=8x8

[colors]
background=1e1e2e
foreground=cdd6f4
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de
selection-foreground=1e1e2e
selection-background=b4befe
