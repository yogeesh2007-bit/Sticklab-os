# StickLab OS Hyprland config — dynamic tiling WM with eye candy.
# Same Bolt (= Alt) keys as Labwc/Sway. Switch sessions: `rsetup wm hyprland`.
# Reload after edits: Bolt+Shift+R. Full options: https://wiki.hyprland.org

# Bolt = ALT. Super is left alone so a host OS (e.g. Omarchy) keeps it in a VM.
$bolt = ALT
$term = foot
$menu = wofi --show drun

# Autostart: same wallpaper color, bar, notifications, terminal server as the other WMs
exec-once = swaybg -o '*' -c '#1e1e2e'
exec-once = waybar
exec-once = mako
exec-once = foot --server

# Look: lavender accent #b4befe, 8px gaps + rounding (matches Labwc theme)
general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  col.active_border = rgba(b4befeff)
  col.inactive_border = rgba(313244ff)
  layout = dwindle
}
decoration {
  rounding = 8
}
animations {
  enabled = yes
}

# Basics: terminal | launcher | close | fullscreen
bind = $bolt, Return, exec, $term
bind = $bolt, D, exec, $menu
bind = $bolt, Q, killactive,
bind = $bolt, F, fullscreen,

# Screenshot (Bolt+S) → ~/Pictures · lock (Bolt+L)
bind = $bolt, S, exec, sh -c 'mkdir -p ~/Pictures && grim -g "$(slurp)" ~/Pictures/shot-$(date +%s).png'
bind = $bolt, L, exec, swaylock -f -c 1e1e2e

# Workspaces 1-4 (matches Labwc/Sway) + move windows there with Shift
bind = $bolt, 1, workspace, 1
bind = $bolt, 2, workspace, 2
bind = $bolt, 3, workspace, 3
bind = $bolt, 4, workspace, 4
bind = $bolt SHIFT, 1, movetoworkspace, 1
bind = $bolt SHIFT, 2, movetoworkspace, 2
bind = $bolt SHIFT, 3, movetoworkspace, 3
bind = $bolt SHIFT, 4, movetoworkspace, 4
bind = $bolt, Tab, workspace, m+1
bind = $bolt SHIFT, Tab, workspace, m-1

# Tiling controls (hyprland-only extras)
bind = $bolt, B, splitratio, exact 0.5
bind = $bolt, E, togglefloating,
bind = $bolt, Left, movefocus, l
bind = $bolt, Down, movefocus, d
bind = $bolt, Up, movefocus, u
bind = $bolt, Right, movefocus, r
bind = $bolt SHIFT, Left, movewindow, l
bind = $bolt SHIFT, Down, movewindow, d
bind = $bolt SHIFT, Up, movewindow, u
bind = $bolt SHIFT, Right, movewindow, r
bind = $bolt SHIFT, R, exec, hyprctl reload

# Mouse: Bolt + drag moves/resizes (matches floating expectations)
bindm = $bolt, mouse:272, movewindow
bindm = $bolt, mouse:273, resizewindow
